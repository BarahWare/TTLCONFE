services:
  api:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://eventops:eventops@db:5432/eventops
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on: [db, redis]
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eventops
      POSTGRES_PASSWORD: eventops
      POSTGRES_DB: eventops
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api]

volumes:
  postgres_data:
